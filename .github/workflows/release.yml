name: Build Washington Images

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - 'release/**'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: current)'
        required: false
      version:
        description: 'Explicit release version (e.g. 25.0.3-test). Must not be a production format (e.g. 25.0.3).'
        required: false
      marauder_tag:
        description: 'Specific Marauder release tag to use (e.g. v1.2.3-test). Must not be a production format (e.g. v1.2.3).'
        required: false
        type: string
  repository_dispatch:
    types:
      - marauder-release

env:
  REGISTRY_HOSTNAME: ghcr.io
  IMAGE_NAME: ghcr.io/vunetsystems/keycloak
  RELEASE_BRANCH_PREFIX: "release/"
  MAIN_BRANCH: "develop"
  HANOI_REPO: hanoi

jobs:

  branch-context:
    name: Branch Context
    runs-on: ubuntu-latest
    outputs:
      branch-type:       ${{ steps.ctx.outputs.branch-type }}
      image-tag-prefix:  ${{ steps.ctx.outputs.image-tag-prefix }}
      hanoi-target:      ${{ steps.ctx.outputs.hanoi-target }}
      should-build:      ${{ steps.ctx.outputs.should-build }}
      run-versioning:    ${{ steps.ctx.outputs.run-versioning }}
      run-release:       ${{ steps.ctx.outputs.run-release }}
      concurrency-group: ${{ steps.ctx.outputs.concurrency-group }}
      is-test-run:       ${{ steps.ctx.outputs.is-test-run }}

    steps:
      - name: Checkout Washington
        uses: actions/checkout@v4

      - name: Compute branch context
        id: ctx
        run: |
          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          PR_MERGED="${{ github.event.pull_request.merged }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"

          echo "branch-type=none"       >> $GITHUB_OUTPUT
          echo "image-tag-prefix="      >> $GITHUB_OUTPUT
          echo "hanoi-target="          >> $GITHUB_OUTPUT
          echo "should-build=false"     >> $GITHUB_OUTPUT
          echo "run-versioning=false"   >> $GITHUB_OUTPUT
          echo "run-release=false"      >> $GITHUB_OUTPUT
          echo "concurrency-group=none" >> $GITHUB_OUTPUT
          echo "is-test-run=false"      >> $GITHUB_OUTPUT

          if [[ "$EVENT" == "repository_dispatch" ]]; then
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
            if [[ "$TRIGGERED_BY" == "manual" ]]; then
              echo "is-test-run=true" >> $GITHUB_OUTPUT
            fi
            echo "branch-type=develop"                              >> $GITHUB_OUTPUT
            echo "image-tag-prefix=main-b${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "hanoi-target=develop"                            >> $GITHUB_OUTPUT
            echo "should-build=true"                               >> $GITHUB_OUTPUT
            echo "run-versioning=false"                            >> $GITHUB_OUTPUT
            echo "run-release=true"                                >> $GITHUB_OUTPUT
            echo "concurrency-group=washington-develop"            >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$REF" == feature/* ]]; then
            BRANCH_SLUG=$(echo "$REF" | sed 's|feature/||' | sed 's|[^a-zA-Z0-9]|-|g' | sed 's|-*$||')
            echo "branch-type=feature"                                             >> $GITHUB_OUTPUT
            echo "image-tag-prefix=feat-${BRANCH_SLUG}-b${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "hanoi-target=$REF"                                               >> $GITHUB_OUTPUT
            echo "should-build=true"                                               >> $GITHUB_OUTPUT
            echo "run-versioning=false"                                            >> $GITHUB_OUTPUT
            echo "run-release=false"                                               >> $GITHUB_OUTPUT
            echo "concurrency-group=washington-feature-${BRANCH_SLUG}"            >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$EVENT" == "pull_request" && "$PR_MERGED" == "true" && "$BASE_REF" == "develop" ]]; then
            echo "branch-type=develop"                              >> $GITHUB_OUTPUT
            echo "image-tag-prefix=main-b${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "hanoi-target=develop"                            >> $GITHUB_OUTPUT
            echo "should-build=true"                               >> $GITHUB_OUTPUT
            echo "run-versioning=false"                            >> $GITHUB_OUTPUT
            echo "run-release=true"                                >> $GITHUB_OUTPUT
            echo "concurrency-group=washington-develop"            >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$EVENT" == "pull_request" && "$PR_MERGED" == "true" && "$BASE_REF" =~ ^release/ ]]; then
            RELEASE_SLUG=$(echo "$BASE_REF" | sed 's|release/||' | sed 's|[^a-zA-Z0-9]|-|g')
            echo "branch-type=release"                                   >> $GITHUB_OUTPUT
            echo "image-tag-prefix="                                     >> $GITHUB_OUTPUT
            echo "hanoi-target=$BASE_REF"                               >> $GITHUB_OUTPUT
            echo "should-build=true"                                     >> $GITHUB_OUTPUT
            echo "run-versioning=true"                                   >> $GITHUB_OUTPUT
            echo "run-release=true"                                      >> $GITHUB_OUTPUT
            echo "concurrency-group=washington-release-${RELEASE_SLUG}" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            INPUT_REF="${{ github.event.inputs.branch }}"
            ACTUAL_REF="${INPUT_REF:-$REF}"
            MARAUDER_TAG="${{ github.event.inputs.marauder_tag }}"
            INPUT_VERSION="${{ github.event.inputs.version }}"

            # ── Production tag guards ────────────────────────────────────────

            # Reject production-format version input
            if [[ -n "$INPUT_VERSION" ]]; then
              if echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                git fetch --tags --quiet
                if git ls-remote --tags origin | grep -q "refs/tags/v${INPUT_VERSION}$"; then
                  echo "ERROR: '$INPUT_VERSION' is a production-format version and tag v${INPUT_VERSION} already exists. Aborting to prevent overriding a production artifact."
                  exit 1
                else
                  echo "WARNING: '$INPUT_VERSION' is a production-format version but tag does not exist yet. Proceeding as test run."
                fi
              fi
            fi

            # Reject production-format marauder tag if it already exists
            if [[ -n "$MARAUDER_TAG" ]]; then
              if echo "$MARAUDER_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                git fetch --tags --quiet
                if git ls-remote --tags origin | grep -q "refs/tags/${MARAUDER_TAG}$"; then
                  echo "ERROR: '$MARAUDER_TAG' is a production-format tag and already exists. Aborting to prevent overriding a production artifact."
                  exit 1
                else
                  echo "WARNING: '$MARAUDER_TAG' is a production-format tag but does not exist yet. Proceeding as test run."
                fi
              fi
            fi

            # Any manual dispatch is always a test run — no versioning, no release, no Helm
            echo "is-test-run=true" >> $GITHUB_OUTPUT

            if [[ "$ACTUAL_REF" == feature/* ]]; then
              BRANCH_SLUG=$(echo "$ACTUAL_REF" | sed 's|feature/||' | sed 's|[^a-zA-Z0-9]|-|g')
              echo "branch-type=feature"                                             >> $GITHUB_OUTPUT
              echo "image-tag-prefix=feat-${BRANCH_SLUG}-b${{ github.run_number }}" >> $GITHUB_OUTPUT
              echo "hanoi-target=$ACTUAL_REF"                                        >> $GITHUB_OUTPUT
              echo "run-versioning=false"                                            >> $GITHUB_OUTPUT
              echo "run-release=false"                                               >> $GITHUB_OUTPUT
              echo "concurrency-group=washington-feature-${BRANCH_SLUG}"            >> $GITHUB_OUTPUT
            elif [[ "$ACTUAL_REF" == "develop" ]]; then
              echo "branch-type=develop"                              >> $GITHUB_OUTPUT
              echo "image-tag-prefix=main-b${{ github.run_number }}" >> $GITHUB_OUTPUT
              echo "hanoi-target=develop"                            >> $GITHUB_OUTPUT
              echo "run-versioning=false"                            >> $GITHUB_OUTPUT
              echo "run-release=false"                               >> $GITHUB_OUTPUT
              echo "concurrency-group=washington-develop"            >> $GITHUB_OUTPUT
            elif [[ "$ACTUAL_REF" == release/* ]]; then
              RELEASE_SLUG=$(echo "$ACTUAL_REF" | sed 's|release/||' | sed 's|[^a-zA-Z0-9]|-|g')
              echo "branch-type=release"                                   >> $GITHUB_OUTPUT
              echo "image-tag-prefix="                                     >> $GITHUB_OUTPUT
              echo "hanoi-target=$ACTUAL_REF"                             >> $GITHUB_OUTPUT
              echo "run-versioning=false"                                  >> $GITHUB_OUTPUT
              echo "run-release=false"                                     >> $GITHUB_OUTPUT
              echo "concurrency-group=washington-release-${RELEASE_SLUG}" >> $GITHUB_OUTPUT
            fi
            echo "should-build=true" >> $GITHUB_OUTPUT
          fi

  gate:
    name: Serialisation Gate
    needs: branch-context
    if: always() && needs.branch-context.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.branch-context.outputs.concurrency-group }}
      cancel-in-progress: false
    steps:
      - name: Acquired concurrency slot
        run: echo "Concurrency group ${{ needs.branch-context.outputs.concurrency-group }} acquired"

  versioning:
    name: Versioning
    needs: [branch-context, gate]
    if: |
      always() &&
      needs.branch-context.outputs.should-build == 'true' &&
      needs.branch-context.outputs.is-test-run == 'false' &&
      needs.gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      next-version:  ${{ steps.next-version.outputs.next-version }}
      cur-version:   ${{ steps.cur-version.outputs.version }}
      sem-version:   ${{ steps.cur-version.outputs.sem-version }}
      patch-version: ${{ steps.patch-version.outputs.version }}
      release-type:  ${{ steps.release-type.outputs.type }}
      jira-ticket:   ${{ steps.extract-jira.outputs.ticket }}
    env:
      MINOR_RELEASE: ${{ contains(github.event.head_commit.message, '[release]') || contains(github.event.pull_request.title, '[release]') }}

    steps:
      - name: Checkout Washington
        uses: actions/checkout@v4

      - name: Extract Jira Ticket
        id: extract-jira
        run: |
          TICKET=""

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == feature/* ]]; then
            SUFFIX="${{ github.ref_name }}"
            SUFFIX="${SUFFIX#feature/}"
            TICKET=$(echo "$SUFFIX" | grep -oP '^[A-Z]+-[0-9]+' || true)
          fi

          if [ -z "$TICKET" ]; then
            PR_TITLE="${{ github.event.pull_request.title || github.event.head_commit.message }}"
            TICKET=$(echo "$PR_TITLE" | grep -oP '[A-Z]+-\d+' || true)
          fi

          echo "ticket=${TICKET:-}" >> $GITHUB_OUTPUT
          echo "Jira ticket: ${TICKET:-none}"

      - name: Read current version
        id: cur-version
        run: |
          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          ACTUAL_REF="$REF"
          [ "$EVENT" == "pull_request" ] && ACTUAL_REF="$BASE_REF"
          [ "$EVENT" == "repository_dispatch" ] && ACTUAL_REF="develop"

          if [[ "$ACTUAL_REF" == release/* ]]; then
            MAJOR_MINOR=$(echo "$ACTUAL_REF" | sed 's|release/||')
          else
            MAJOR_MINOR=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('pom.xml')
          root = tree.getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          ver = root.find('m:version', ns).text.replace('-SNAPSHOT', '')
          parts = ver.split('.')
          print('.'.join(parts[:2]))
          ")
          fi
          echo "version=$MAJOR_MINOR"        >> $GITHUB_OUTPUT
          echo "sem-version=${MAJOR_MINOR}.0" >> $GITHUB_OUTPUT

      - name: Calculate next patch version
        id: patch-version
        run: |
          EXPLICIT="${{ github.event.inputs.version }}"
          if [ -n "$EXPLICIT" ]; then
            echo "version=$EXPLICIT" >> $GITHUB_OUTPUT
          else
            MAJOR_MINOR="${{ steps.cur-version.outputs.version }}"
            git fetch --tags --quiet
            LATEST=$(git tag -l "v${MAJOR_MINOR}.*" | sort -V | tail -1)
            if [ -n "$LATEST" ]; then
              PATCH=$(echo "$LATEST" | awk -F '.' '{ print $3 }')
              NEXT_PATCH=$((PATCH + 1))
            else
              NEXT_PATCH=0
            fi
            echo "version=${MAJOR_MINOR}.${NEXT_PATCH}" >> $GITHUB_OUTPUT
          fi

      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ env.MINOR_RELEASE }}" == "true" ]]; then
            echo "type=feature" >> $GITHUB_OUTPUT
          else
            echo "type=bug" >> $GITHUB_OUTPUT
          fi

      - name: Increment Semantic version
        id: next-version
        uses: christian-draeger/increment-semantic-version@4ac542a8ebf91f4edc224cbe3a19cc086826ae77
        with:
          current-version: ${{ steps.cur-version.outputs.sem-version }}
          version-fragment: ${{ steps.release-type.outputs.type }}

  build:
    name: Build and Push Image
    needs: [branch-context, gate, versioning]
    if: always() && needs.branch-context.outputs.should-build == 'true' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      combined-tag: ${{ steps.tags.outputs.combined_tag }}
      digest:       ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Washington
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VUNET_NEW_CICD_APP_ID }}
          private-key: ${{ secrets.VUNET_NEW_CICD_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: marauder

      - name: Resolve Marauder version
        run: |
          BRANCH_TYPE='${{ needs.branch-context.outputs.branch-type }}'

          if [[ "$BRANCH_TYPE" == "feature" ]]; then
            echo "MARAUDER_VERSION=none" >> $GITHUB_ENV
            echo "MARAUDER_TARBALL="     >> $GITHUB_ENV
            echo "Skipping Marauder resolution for feature branch build"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            MARAUDER_VERSION="${{ github.event.client_payload.release_tag }}"
            MARAUDER_TARBALL="${{ github.event.client_payload.tarball }}"
            echo "repository_dispatch: using Marauder tag $MARAUDER_VERSION"

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.marauder_tag }}" ]]; then
            MARAUDER_VERSION="${{ github.event.inputs.marauder_tag }}"
            MARAUDER_TARBALL="marauder-plugins-${MARAUDER_VERSION}.tar.gz"
            echo "Manual trigger: using explicit Marauder tag $MARAUDER_VERSION"

          else
            MARAUDER_VERSION="$(
              curl -fsSL \
                -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/vunetsystems/marauder/releases/latest \
              | jq -r '.tag_name'
            )"
            MARAUDER_TARBALL="marauder-plugins-${MARAUDER_VERSION}.tar.gz"
            echo "Resolved latest Marauder: $MARAUDER_VERSION"
          fi

          if [ -z "$MARAUDER_VERSION" ] || [ "$MARAUDER_VERSION" == "null" ]; then
            echo "ERROR: Could not resolve Marauder version. Check that Marauder has at least one published release."
            exit 1
          fi

          echo "MARAUDER_VERSION=${MARAUDER_VERSION}" >> $GITHUB_ENV
          echo "MARAUDER_TARBALL=${MARAUDER_TARBALL}" >> $GITHUB_ENV
          echo "Using Marauder version: ${MARAUDER_VERSION}"
          echo "Using Marauder tarball: ${MARAUDER_TARBALL}"

      - name: Compute image tag
        id: tags
        run: |
          IMAGE_TAG_PREFIX='${{ needs.branch-context.outputs.image-tag-prefix }}'
          BRANCH_TYPE='${{ needs.branch-context.outputs.branch-type }}'
          PATCH_VER='${{ needs.versioning.outputs.patch-version }}'

          if [ "$BRANCH_TYPE" == "release" ] && [ -n "$PATCH_VER" ]; then
            COMBINED_TAG="$PATCH_VER"
          else
            COMBINED_TAG="$IMAGE_TAG_PREFIX"
          fi

          echo "combined_tag=$COMBINED_TAG" >> $GITHUB_OUTPUT

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          if [ "$BRANCH_TYPE" != "feature" ]; then
            echo "${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          fi
          echo "${{ env.IMAGE_NAME }}:$COMBINED_TAG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set Keycloak version
        if: needs.branch-context.outputs.run-versioning == 'true'
        run: ./set-version.sh ${{ needs.versioning.outputs.patch-version }}

      - name: Build Keycloak
        uses: ./.github/actions/build-keycloak

      - name: Copy Keycloak dist into Docker context
        run: cp quarkus/dist/target/keycloak-*.tar.gz quarkus/container/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./quarkus/container/
          file: ./quarkus/container/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            KEYCLOAK_VERSION=${{ steps.tags.outputs.combined_tag }}
            MARAUDER_VERSION=${{ env.MARAUDER_VERSION }}
            MARAUDER_TARBALL=${{ env.MARAUDER_TARBALL }}

      - name: Install Cosign
        if: success()
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign image with Cosign
        if: success() && steps.build.outputs.digest != ''
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          cosign sign --key cosign.key --yes "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          rm -f cosign.key

      - name: Upload release artifact
        if: needs.branch-context.outputs.run-release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-dist
          path: quarkus/dist/target/keycloak-*.tar.gz

  helm-update:
    name: Update Hanoi Helm Charts
    needs: [branch-context, gate, build]
    if: |
      always() &&
      needs.branch-context.outputs.should-build == 'true' &&
      needs.branch-context.outputs.is-test-run == 'false' &&
      needs.gate.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      HANOI_TARGET: ${{ needs.branch-context.outputs.hanoi-target }}

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VUNET_NEW_CICD_APP_ID }}
          private-key: ${{ secrets.VUNET_NEW_CICD_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.HANOI_REPO }}

      - name: Checkout Washington
        uses: actions/checkout@v4
        with:
          path: washington
          fetch-depth: 0

      - name: Checkout Hanoi
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.HANOI_REPO }}
          token: ${{ steps.generate-token.outputs.token }}
          path: hanoi
          fetch-depth: 0

      - name: Setup Hanoi branch
        run: |
          cd hanoi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET="${{ env.HANOI_TARGET }}"
          if git ls-remote --heads origin "$TARGET" | grep -q "$TARGET"; then
            git checkout "$TARGET"
          else
            git checkout -b "$TARGET"
          fi

      - name: Update Helm chart image tag
        run: |
          cd hanoi
          TAG='${{ needs.build.outputs.combined-tag }}'
          MAP_FILE="../washington/.ci/helm-map.json"
          CHART_PATHS="helm-charts/keycloak"
          IMAGE_NAME="${{ github.repository_owner }}/infra-keycloak"

          if [ -f "$MAP_FILE" ]; then
            MAPPED_PATHS=$(jq -r '.keycloak.chart_paths[]? // empty' "$MAP_FILE")
            MAPPED_SUFFIX=$(jq -r '.keycloak.image_suffix // empty' "$MAP_FILE")
            [ -n "$MAPPED_PATHS" ] && CHART_PATHS="$MAPPED_PATHS"
            [ -n "$MAPPED_SUFFIX" ] && IMAGE_NAME="${{ github.repository_owner }}/infra-${MAPPED_SUFFIX}"
          fi

          for chart in $CHART_PATHS; do
            [ -f "$chart/values.yaml" ] && \
              sed -i "s|imageTag:.*|imageTag: $TAG|" "$chart/values.yaml" && \
              sed -i "s|imageName:.*|imageName: $IMAGE_NAME|" "$chart/values.yaml"
          done

          git diff --quiet || {
            git add .
            git commit -m "chore: update keycloak image tag to $TAG"
            git push origin "$(git branch --show-current)"
          }

  release:
    name: Create GitHub Release
    needs: [branch-context, gate, build, versioning, helm-update]
    if: |
      always() &&
      needs.branch-context.outputs.run-release == 'true' &&
      needs.branch-context.outputs.is-test-run == 'false' &&
      needs.branch-context.outputs.branch-type != 'feature' &&
      needs.gate.result == 'success' &&
      needs.build.result == 'success' &&
      needs.helm-update.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Washington
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.COMMIT_KEY }}

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: keycloak-dist
          path: dist
          if-no-files-found: ignore

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATCH="${{ needs.versioning.outputs.patch-version }}"
          git config user.email "github-actions@noreply.github.com"
          git config user.name "github-actions[bot]"

          if git tag "v${PATCH}" 2>/dev/null; then
            git push origin "v${PATCH}"
          else
            echo "Tag v${PATCH} already exists, skipping tag creation"
            exit 0
          fi

          PRERELEASE_FLAG=""
          [ "${{ needs.branch-context.outputs.branch-type }}" == "develop" ] && PRERELEASE_FLAG="--prerelease"
          ARTIFACTS=$(ls dist/keycloak-*.tar.gz 2>/dev/null | xargs -I{} echo "{}" || true)

          if gh release view "v${PATCH}" > /dev/null 2>&1; then
            echo "Release v${PATCH} already exists, skipping release creation"
            exit 0
          fi

          gh release create "v${PATCH}" \
            --title "Release v${PATCH}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            $ARTIFACTS

  jira-success:
    name: Update Jira Ticket (Build Success)
    needs:
      - branch-context
      - versioning
      - build
      - helm-update
      - release
    runs-on: ubuntu-latest
    if: |
      success() &&
      needs.branch-context.outputs.is-test-run == 'false' &&
      needs.versioning.outputs.jira-ticket != ''
    env:
      JIRA_URL:       ${{ secrets.JIRA_URL }}
      JIRA_USERNAME:  ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      BRANCH_NAME:    ${{ github.ref_name }}
      REPOSITORY:     ${{ github.repository }}
      RELEASE_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Post Build Success Comment to Jira
        run: |
          IMAGE_TAG='${{ needs.build.outputs.combined-tag }}'
          OWNER='${{ github.repository_owner }}'

          COMMENT="Build and Deploy Success\n\n"
          COMMENT+="Repository: ${REPOSITORY}\n"
          COMMENT+="Branch: ${BRANCH_NAME}\n"
          COMMENT+="Image tag: ${IMAGE_TAG}\n"
          COMMENT+="Image: ghcr.io/${OWNER}/keycloak:${IMAGE_TAG}\n"
          COMMENT+="Helm Charts: Updated in ${{ github.repository_owner }}/${{ env.HANOI_REPO }}\n"
          COMMENT+="Build Run: ${RELEASE_URL}"

          curl -X POST \
            -u "$JIRA_USERNAME:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"body\": \"$COMMENT\"}" \
            "$JIRA_URL/rest/api/2/issue/${{ needs.versioning.outputs.jira-ticket }}/comment"

  jira-failure:
    name: Update Jira Ticket (Build Failed)
    needs:
      - branch-context
      - versioning
      - build
      - helm-update
      - release
    runs-on: ubuntu-latest
    if: |
      failure() &&
      needs.branch-context.outputs.is-test-run == 'false' &&
      needs.versioning.outputs.jira-ticket != ''
    env:
      JIRA_URL:       ${{ secrets.JIRA_URL }}
      JIRA_USERNAME:  ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      BRANCH_NAME:    ${{ github.ref_name }}
      REPOSITORY:     ${{ github.repository }}
      RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Post Build Failure Comment to Jira
        run: |
          IMAGE_TAG='${{ needs.build.outputs.combined-tag }}'

          BUILD_STATUS="${{ needs.build.result }}"
          HELM_STATUS="${{ needs.helm-update.result }}"
          RELEASE_STATUS="${{ needs.release.result }}"

          FAILED_JOBS=""
          [ "$BUILD_STATUS"   == "failure" ] && FAILED_JOBS+="build "
          [ "$HELM_STATUS"    == "failure" ] && FAILED_JOBS+="helm-update "
          [ "$RELEASE_STATUS" == "failure" ] && FAILED_JOBS+="release "

          COMMENT="Build Failed\n\n"
          COMMENT+="Repository: ${REPOSITORY}\n"
          COMMENT+="Branch: ${BRANCH_NAME}\n"
          COMMENT+="Image tag: ${IMAGE_TAG}\n"
          COMMENT+="Failed jobs: ${FAILED_JOBS:-unknown}\n"
          COMMENT+="Build Run: ${RUN_URL}"

          curl -X POST \
            -u "$JIRA_USERNAME:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"body\": \"$COMMENT\"}" \
            "$JIRA_URL/rest/api/2/issue/${{ needs.versioning.outputs.jira-ticket }}/comment"